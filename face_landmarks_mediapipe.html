<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NegoSphere AI Proctoring — Web Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(18, 26, 43, 0.75);
      --border-color: rgba(56, 189, 248, 0.25);
      --accent-cyan: #38bdf8;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-warning: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      width: 12px;
      height: 12px;
      background: var(--accent-cyan);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent-cyan);
    }
    .brand-title {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.5px;
      color: var(--text-main);
    }

    .system-status {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-normal { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .badge-alert { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }

    main {
      flex: 1;
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
    }

    .viewport-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 16/9;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    video { display: none; }

    .risk-bar-container {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .risk-header {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
    }
    .risk-bar {
      height: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
    }
    .risk-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-green);
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
    }

    .panel-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent-cyan);
      margin: 0 0 16px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .telemetry-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .telemetry-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      padding: 8px 12px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 8px;
    }
    .telemetry-label { color: var(--text-muted); }
    .telemetry-val { font-weight: 600; }

    .event-log {
      max-height: 280px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .log-item {
      font-size: 12px;
      padding: 8px 12px;
      background: rgba(15, 23, 42, 0.6);
      border-left: 3px solid var(--accent-cyan);
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
    }
    .log-item.alert { border-left-color: var(--accent-red); background: rgba(239, 68, 68, 0.1); }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }
    button {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-cyan);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: var(--accent-cyan);
      color: #000;
    }
  </style>

  <!-- MediaPipe FaceMesh & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-logo"></div>
      <div class="brand-title">NegoSphere AI Web Proctor</div>
    </div>
    <div class="system-status">
      <span id="system-badge" class="badge badge-normal">MONITORING ACTIVE</span>
    </div>
  </header>

  <main>
    <div class="viewport-card">
      <div class="canvas-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" width="1280" height="720"></canvas>
      </div>

      <div class="risk-bar-container">
        <div class="risk-header">
          <span>REAL-TIME RISK INDEX</span>
          <span id="risk-val">0.0 / 100</span>
        </div>
        <div class="risk-bar">
          <div id="risk-fill" class="risk-fill"></div>
        </div>
      </div>
    </div>

    <div class="sidebar">
      <div class="panel">
        <h2 class="panel-title">TELEMETRY</h2>
        <div class="telemetry-list">
          <div class="telemetry-item">
            <span class="telemetry-label">Gaze Direction</span>
            <span id="tel-gaze" class="telemetry-val" style="color:var(--accent-green)">CENTER</span>
          </div>
          <div class="telemetry-item">
            <span class="telemetry-label">Face Count</span>
            <span id="tel-face" class="telemetry-val">1 Face</span>
          </div>
          <div class="telemetry-item">
            <span class="telemetry-label">Audio Level</span>
            <span id="tel-audio" class="telemetry-val">0 dB</span>
          </div>
          <div class="telemetry-item">
            <span class="telemetry-label">Session Time</span>
            <span id="tel-time" class="telemetry-val">00:00</span>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2 class="panel-title">INCIDENT LOG</h2>
        <div id="event-log" class="event-log">
          <div class="log-item"><span>System initialized</span><span>00:00</span></div>
        </div>
        <div class="btn-group">
          <button id="btn-reset">Reset Score</button>
          <button id="btn-report">Export Audit</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const LEFT_IRIS = [474, 475, 476, 477];
    const RIGHT_IRIS = [469, 470, 471, 472];

    let riskScore = 0;
    let startTime = Date.now();
    let logs = [];

    // Voice alert synth
    function speak(text) {
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 1.0;
        window.speechSynthesis.speak(u);
      }
    }

    function addLog(msg, isAlert=false) {
      const timeStr = new Date().toLocaleTimeString();
      logs.unshift({ msg, timeStr, isAlert });
      
      const logContainer = document.getElementById('event-log');
      const item = document.createElement('div');
      item.className = 'log-item' + (isAlert ? ' alert' : '');
      item.innerHTML = `<span>${msg}</span><span>${timeStr}</span>`;
      logContainer.prepend(item);
    }

    // MediaPipe FaceMesh setup
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 2,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    const camera = new Camera(video, {
      onFrame: async () => {
        await faceMesh.send({ image: video });
      },
      width: 1280,
      height: 720
    });
    camera.start();

    function onResults(results) {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

      let nFaces = results.multiFaceLandmarks ? results.multiFaceLandmarks.length : 0;
      document.getElementById('tel-face').innerText = `${nFaces} Face${nFaces !== 1 ? 's' : ''}`;

      if (nFaces === 0) {
        riskScore = Math.min(100, riskScore + 0.3);
        document.getElementById('tel-gaze').innerText = 'NO FACE';
        document.getElementById('tel-gaze').style.color = 'var(--accent-red)';
      } else if (nFaces > 1) {
        riskScore = Math.min(100, riskScore + 0.8);
        addLog('Multiple faces detected!', true);
      } else {
        const lm = results.multiFaceLandmarks[0];
        window.drawConnectors(ctx, lm, window.FACEMESH_CONTOURS, { color: '#38bdf8', lineWidth: 1 });

        // Calculate iris center average
        function getIrisCenter(idxs) {
          let sx = 0, sy = 0;
          idxs.forEach(i => { sx += lm[i].x * canvas.width; sy += lm[i].y * canvas.height; });
          return { x: sx / idxs.length, y: sy / idxs.length };
        }

        const L = getIrisCenter(LEFT_IRIS);
        const R = getIrisCenter(RIGHT_IRIS);

        ctx.fillStyle = '#10b981';
        ctx.beginPath(); ctx.arc(L.x, L.y, 4, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(R.x, R.y, 4, 0, Math.PI * 2); ctx.fill();

        // Gaze estimate
        const eyeSpan = (lm[263].x - lm[33].x) * canvas.width;
        const relX = (L.x - lm[33].x * canvas.width) / eyeSpan;

        if (relX < 0.38) {
          document.getElementById('tel-gaze').innerText = 'LOOKING LEFT';
          document.getElementById('tel-gaze').style.color = 'var(--accent-warning)';
          riskScore = Math.min(100, riskScore + 0.2);
        } else if (relX > 0.62) {
          document.getElementById('tel-gaze').innerText = 'LOOKING RIGHT';
          document.getElementById('tel-gaze').style.color = 'var(--accent-warning)';
          riskScore = Math.min(100, riskScore + 0.2);
        } else {
          document.getElementById('tel-gaze').innerText = 'CENTER';
          document.getElementById('tel-gaze').style.color = 'var(--accent-green)';
          riskScore = Math.max(0, riskScore - 0.1);
        }
      }

      // Update UI
      document.getElementById('risk-val').innerText = `${riskScore.toFixed(1)} / 100`;
      const fill = document.getElementById('risk-fill');
      fill.style.width = `${Math.min(100, riskScore)}%`;
      fill.style.backgroundColor = riskScore > 50 ? 'var(--accent-red)' : (riskScore > 25 ? 'var(--accent-warning)' : 'var(--accent-green)');

      const badge = document.getElementById('system-badge');
      if (riskScore > 50) {
        badge.innerText = 'HIGH RISK ALERT';
        badge.className = 'badge badge-alert';
      } else {
        badge.innerText = 'MONITORING ACTIVE';
        badge.className = 'badge badge-normal';
      }

      ctx.restore();
    }

    // Timer
    setInterval(() => {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const s = String(elapsed % 60).padStart(2, '0');
      document.getElementById('tel-time').innerText = `${m}:${s}`;
    }, 1000);

    // Audio level meter using Web Audio API
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      const ctx = new AudioContext();
      const src = ctx.createMediaStreamSource(stream);
      const proc = ctx.createAnalyser();
      src.connect(proc);
      const data = new Uint8Array(proc.frequencyBinCount);

      setInterval(() => {
        proc.getByteFrequencyData(data);
        const avg = data.reduce((a, b) => a + b) / data.length;
        document.getElementById('tel-audio').innerText = `${Math.round(avg)} dB`;
      }, 300);
    }).catch(e => console.log('Audio mic permission denied/not available'));

    document.getElementById('btn-reset').onclick = () => {
      riskScore = 0;
      addLog('Risk score reset manually.');
    };

    document.getElementById('btn-report').onclick = () => {
      alert(`Audit Report Summary:\nTotal Logged Events: ${logs.length}\nFinal Risk Index: ${riskScore.toFixed(1)}`);
    };
  </script>
</body>
</html>
